# C Configuration Parser Example Config
; This is also a comment line

debug = true
timeout = 30

[app]
name = MyTestApp
version = 1.2.3
description = """
This is a multi-line description.
It can contain newlines and special characters.
The triple quote syntax makes it easy to write.
"""

[server]
port = 8080
host = localhost
rate = 0.5
timeout = 60

[database]
host = db.example.com
port = 5432
name = mydb
timeout = 120

[paths]
base_dir = /opt/myapp
log_path = ${base_dir}/logs
config_path = ${log_path}/config

[messages]
welcome = Welcome to ${app.name}!

[conversion]
str_num = 42
