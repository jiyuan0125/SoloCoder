server.port=9101

spring.datasource.url=jdbc:h2:mem:vehicledb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.vehicle.maintenance-interval-km=5000
app.vehicle.fuel-warning-threshold=20
app.vehicle.fuel-unavailable-threshold=5
app.dispatch.buffer-minutes=30
app.long-distance-threshold-km=200
app.fuel-deviation-threshold=0.20
app.insurance-reminder-days=30
