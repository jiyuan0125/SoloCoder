[package]
name = "leave_server"
version = "0.1.0"
edition = "2021"

[dependencies]
leave_core = { path = "../core" }
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }
tower = "0.5"
chrono = { version = "0.4", features = ["serde"] }
