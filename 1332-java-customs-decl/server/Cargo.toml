[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
decl_core = { path = "../decl_core" }
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
