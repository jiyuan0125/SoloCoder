[package]
name = "charging_core"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
rust_decimal = { version = "1.34", features = ["serde-with-arbitrary-precision"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1", features = ["sync"] }
