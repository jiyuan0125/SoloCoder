[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
asset_core = { path = "../core" }
clap = { version = "4.0", features = ["derive", "env"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
