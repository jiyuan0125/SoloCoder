[package]
name = "futures-sim-server"
version.workspace = true
edition.workspace = true

[dependencies]
futures-sim-core.workspace = true
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }
tower = "0.4"
