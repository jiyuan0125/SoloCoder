[package]
name = "freight_client"
version.workspace = true
edition.workspace = true

[[bin]]
name = "freight-cli"
path = "src/main.rs"

[dependencies]
freight_core = { path = "../core" }
clap = { version = "4.0", features = ["derive", "env"] }
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls-native-roots"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
