[package]
name = "dorm_client"
version.workspace = true
edition.workspace = true

[dependencies]
dorm_core = { path = "../core" }
clap = { version = "4.0", features = ["derive", "env"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
uuid = "1.0"
