[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-scheduler"
version = "0.1.0"
description = "外卖配送调度系统"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.3",
    "httpx==0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
delivery-server = "server.__main__:main"
delivery-cli = "client.__main__:main"
