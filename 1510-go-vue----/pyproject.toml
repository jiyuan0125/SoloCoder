[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "winery-management"
version = "1.0.0"
description = "Winery internal management system with FastAPI backend and CLI client"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pydantic==2.5.3",
    "requests==2.31.0",
    "python-dateutil==2.8.2",
]

[tool.setuptools.packages.find]
where = ["src"]
