[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aquaculture-manager"
version = "0.1.0"
description = "水产种苗场繁育和销售管理系统"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.6.4",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "typer==0.12.0",
    "rich==13.7.1"
]

[project.scripts]
aquaculture-server = "src.server.__main__:main"
aquaculture-client = "src.client.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
