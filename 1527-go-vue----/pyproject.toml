[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coal-mine-monitor"
version = "1.0.0"
description = "煤矿通风瓦斯监测管理系统"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
    "httpx>=0.25.0",
    "click>=8.0.0",
    "aiosqlite>=0.19.0",
]

[project.scripts]
monitor = "client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
