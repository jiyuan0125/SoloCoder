[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tailing-monitor"
version = "0.1.0"
description = "Tailings pond safety monitoring and management system"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.3",
    "httpx>=0.26.0",
    "python-dateutil>=2.8.2",
]

[tool.setuptools.packages.find]
where = ["src"]
