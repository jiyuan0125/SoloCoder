[package]
name = "rust-limiter"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
once_cell = "1"
parking_lot = "0.12"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
