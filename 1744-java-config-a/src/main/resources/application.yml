server:
  port: 8888

spring:
  application:
    name: config-center
  datasource:
    url: jdbc:h2:mem:configcenter;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

config:
  long-polling:
    timeout: 30000
  release:
    gray-instance-timeout: 60000
