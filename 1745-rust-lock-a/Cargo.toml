[package]
name = "distributed-lock-service"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
