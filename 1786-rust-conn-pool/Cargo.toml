[package]
name = "conn-pool"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
dashmap = "5"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio-test = "0.4"
