server:
  port: 8303

spring:
  application:
    name: log-aggregator
  datasource:
    url: jdbc:h2:mem:logdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
  h2:
    console:
      enabled: true
      path: /h2-console

log-aggregator:
  retention-days: 7
  max-message-size: 10240
  default-page-size: 50
