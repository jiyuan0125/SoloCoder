[package]
name = "reverse-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-rt = "2"
awc = "3"
regex = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
log = "0.4"
env_logger = "0.11"
url = "2"
async-trait = "0.1"
futures-util = "0.3"
