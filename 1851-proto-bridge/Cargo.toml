[package]
name = "proto-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tower = "0.5"
http-body-util = "0.1"
bytes = "1"
once_cell = "1"
base64 = "0.22"
hyper = { version = "1", features = ["full"] }
hyper-util = "0.1"
http = "1"
