[package]
name = "gw-core"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.5"
actix-rt = "2.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.36", features = ["full"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
env_logger = "0.11"
log = "0.4"
futures-util = "0.3"
