[package]
name = "cache-middleware"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["limit"] }
parking_lot = "0.12"
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
