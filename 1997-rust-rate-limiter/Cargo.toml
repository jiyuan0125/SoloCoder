[package]
name = "rate-limiter"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
lru = "0.12"
async-trait = "0.1"
bytes = "1"
http = "1"
http-body-util = "0.1"
log = "0.4"
env_logger = "0.11"
dashmap = "6"
