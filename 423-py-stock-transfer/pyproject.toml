[project]
name = "stock-transfer-system"
version = "0.1.0"
description = "Multi-warehouse stock transfer API system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "typer>=0.9.0",
    "httpx>=0.26.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "pytest>=7.4.0",
]

[project.scripts]
stock-transfer = "cli.commands:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared", "server", "cli", "shared.*", "server.*", "cli.*"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = [
    "tests/",
    ".venv/",
]

[[tool.mypy.overrides]]
module = "shared.models"
disable_error_code = ["prop-decorator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
