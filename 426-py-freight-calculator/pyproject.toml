[project]
name = "freight-calculator"
version = "1.0.0"
description = "跨系统多模块运费计算服务 - shared/server/cli 三模块架构"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.mypy]
strict = true
python_version = "3.10"
explicit_package_bases = true
namespace_packages = true

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
]

[tool.hatch.build.targets.wheel]
packages = ["shared", "server", "cli"]
