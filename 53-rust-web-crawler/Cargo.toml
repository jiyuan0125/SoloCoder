[package]
name = "web_crawler"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["blocking", "cookies", "rustls-tls"], default-features = false }
scraper = "0.19"
url = "2.5"
futures = "0.3"
thiserror = "1.0"
anyhow = "1.0"
hashbrown = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
